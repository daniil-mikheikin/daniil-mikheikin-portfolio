IncPanel}}"><div style="overflow: hidden; min-height: 0;"><ul style="list-style: none; margin: 0; padding: 34px 0 12px; display: flex; flex-direction: column; gap: 19px;"><li style="display: flex; align-items: flex-start; gap: 25px; font-size: 18px; line-height: 22px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7F52FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 20px; margin-top: 1px;"><path d="M4 12.5 L9.5 18 L20 6.5"></path></svg><span>10 AI Credits per 30 days<sup style="font-size: 12px; line-height: 0; margin-left: 2px;"><a href="#fn-1" id="r1_dot_inc" onClick="{{ref_r1_dot_inc}}" aria-label="Footnote 1" style="color: #7F52FF; text-decoration: underline;">1</a></sup></span></li><li style="display: flex; align-items: flex-start; gap: 25px; font-size: 18px; line-height: 22px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7F52FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 20px; margin-top: 1px;"><path d="M4 12.5 L9.5 18 L20 6.5"></path></svg><span>Flagship .NET &amp; Game IDE</span></li><li style="display: flex; align-items: flex-start; gap: 25px; font-size: 18px; line-height: 22px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7F52FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 20px; margin-top: 1px;"><path d="M4 12.5 L9.5 18 L20 6.5"></path></svg><span>Visual Studio Boosters</span></li><li style="display: flex; align-items: flex-start; gap: 25px; font-size: 18px; line-height: 22px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7F52FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 20px; margin-top: 1px;"><path d="M4 12.5 L9.5 18 L20 6.5"></path></svg><span>Advanced access to dotTrace (CPU diagnostics) and dotMemory</span></li><li style="display: flex; align-items: flex-start; gap: 25px; font-size: 18px; line-height: 22px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7F52FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 20px; margin-top: 1px;"><path d="M4 12.5 L9.5 18 L20 6.5"></path></svg><span>Complete access to dotCover for unit test reporting and dotPeek</span></li></ul></div></div></div></div><div style="display: flex; align-items: flex-start; gap: 14px; margin-top: 41px;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 20px; margin-top: 3px;"><circle cx="12" cy="12" r="10" fill="#19191C"></circle><path d="M12 10.6v6" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"></path><circle cx="12" cy="7.2" r="1.3" fill="#ffffff"></circle></svg><p style="margin: 0; font-size: 18px; line-height: 1.45;">The tax rate depends on your country&#8217;s tax rules, the tax identification number you enter (e.g. <a href="#vat-id" style="text-decoration: underline;">VAT ID</a>), and your selected purchase method.</p></div><ol style="margin: 65px 0 0; padding-left: 24px; display: flex; flex-direction: column; gap: 28px; font-size: 18px; line-height: 27px; max-width: 1180px;"><li id="fn-1" style="padding-left: 4px;"><div style="display: flex; flex-direction: column; gap: 14px;"><p style="margin: 0;"><strong>What is 1 AI Credit worth?</strong> 1 AI Credit = USD 1.00, charged in your local currency. AI Credits pay for cloud AI: AI chat, coding agents like Junie, and other features powered by third-party models. Code completion and next edit suggestions run on JetBrains&#8217; own models and never use credits.</p><p style="margin: 0;">As a rough guide, 1 AI Credit covers about:</p><div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; max-width: 980px;"><div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: #F7F4FF; border: 1px solid #E6DEFF; border-radius: 10px;"><span style="font-size: 26px; line-height: 30px; font-weight: 700; color: #7F52FF;">~10</span><span style="font-size: 15px; line-height: 20px; color: #55555A;">AI Chat code generations</span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: #F7F4FF; border: 1px solid #E6DEFF; border-radius: 10px;"><span style="font-size: 26px; line-height: 30px; font-weight: 700; color: #7F52FF;">~40</span><span style="font-size: 15px; line-height: 20px; color: #55555A;">in-editor code generations</span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: #F7F4FF; border: 1px solid #E6DEFF; border-radius: 10px;"><span style="font-size: 26px; line-height: 30px; font-weight: 700; color: #7F52FF;">~25</span><span style="font-size: 15px; line-height: 20px; color: #55555A;">code explanations</span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: #F7F4FF; border: 1px solid #E6DEFF; border-radius: 10px;"><span style="font-size: 26px; line-height: 30px; font-weight: 700; color: #7F52FF;">~140</span><span style="font-size: 15px; line-height: 20px; color: #55555A;">commit messages</span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: #F7F4FF; border: 1px solid #E6DEFF; border-radius: 10px;"><span style="font-size: 26px; line-height: 30px; font-weight: 700; color: #7F52FF;">~280</span><span style="font-size: 15px; line-height: 20px; color: #55555A;">documentation requests</span></div></div><p style="margin: 0;">So the 10 AI Credits in AI Pro cover roughly 100 AI Chat code generations every 30 days. You get AI Credits equal to the value of your plan, plus a small bonus with AI Ultimate. <span style="color: #55555A;">These are JetBrains&#8217; own rough estimates; the final cost of an AI action depends on the model, the context size and the task.</span></p><p style="margin: 0;">Long chat histories consume significantly more credits per prompt. Start a new chat session frequently to keep token costs low and save your credits.<a href="#{{fn1Back}}" aria-label="Back to where you were" style="display: inline-flex; vertical-align: -2px; margin-left: 6px; color: #7F52FF;"><svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 1v4a4 4 0 0 1-4 4H3M7 5 3 9l4 4"></path></svg></a></p></div></li><li id="fn-2" style="padding-left: 4px;">JetBrains IDEs support <a href="#byok" style="text-decoration: underline;">Bring Your Own Key (BYOK)</a>, allowing you to connect your own API keys from Anthropic, OpenAI, and other OpenAI-compatible providers. You can also connect any <a href="#acp" style="text-decoration: underline;">ACP-compatible agent</a>, such as Cursor or GitHub Copilot, <strong>using your own subscription</strong>.<a href="#{{fn2Back}}" aria-label="Back to where you were" style="display: inline-flex; vertical-align: -2px; margin-left: 6px; color: #7F52FF;"><svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 1v4a4 4 0 0 1-4 4H3M7 5 3 9l4 4"></path></svg></a></li></ol><h2 id="faq" style="margin: 80px 0 49px; text-align: center; font-size: 40px; line-height: 48px; font-weight: 700; letter-spacing: -0.01em;">Frequently asked questions</h2><div style="margin-left: 14%; max-width: 840px;"><div style="margin-bottom: 16px;"><h3 style="margin: 0;"><button type="button" class="jb-cat" onClick="{{c_startToggle}}" aria-expanded="{{c_startOpen}}" aria-controls="faq-cat-start" style="display: flex; align-items: center; justify-content: space-between; width: 300px; max-width: 100%; padding: 10px 0; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 24px; font-weight: 600; line-height: 36px; color: #19191C;"><span style="position: relative;">Getting started and usage<span aria-hidden="true" style="{{c_startUl}}"></span></span><svg width="9" height="12" viewBox="0 0 9 12" aria-hidden="true"><path d="M0 0 L9 6 L0 12 Z" fill="#7F52FF"></path></svg></button></h3><div id="faq-cat-start" style="{{c_startPanel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 0 0 8px;"><div style="position: relative;"><span aria-hidden="true" style="{{q_start_0Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-start-q0" onClick="{{q_start_0Toggle}}" aria-expanded="{{q_start_0Open}}" aria-controls="faq-start-a0" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_start_0Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Which JetBrains IDEs offer AI features?</button></h4><div id="faq-start-a0" role="region" aria-labelledby="faq-start-q0" style="{{q_start_0Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">AI features are available in all <a href="#jetbrains-ides" style="text-decoration: underline;">JetBrains IDEs</a>, as well as in Android Studio. However, features may vary depending on the IDE. <a href="#ai-docs" style="text-decoration: underline;">Refer to the documentation for details.</a></p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_start_1Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-start-q1" onClick="{{q_start_1Toggle}}" aria-expanded="{{q_start_1Open}}" aria-controls="faq-start-a1" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_start_1Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>What AI features are available in JetBrains IDEs?</button></h4><div id="faq-start-a1" role="region" aria-labelledby="faq-start-q1" style="{{q_start_1Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">AI in JetBrains IDEs includes a range of capabilities that can be accessed through the AI Assistant plugin.</p><p style="margin: 0;">Key capabilities include:</p><ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px;"><li style="padding-left: 2px;">In-editor code completion and next edit suggestions (NES)<div style="color: #55555A;">AI-powered assistance for writing and modifying code as you type.</div></li><li style="padding-left: 2px;">AI chat with a choice of coding agents<div style="color: #55555A;">Work with multiple agents, including Junie by JetBrains and third-party agents such as Claude Agent, OpenAI Codex, and Gemini CLI. Or connect and use any ACP-compatible agent with your own subscription.</div></li><li style="padding-left: 2px;">Context-aware AI actions<div style="color: #55555A;">Explain code, suggest refactoring, detect issues, and generate documentation directly in the editor.</div></li><li style="padding-left: 2px;">AI-enhanced workflows<div style="color: #55555A;">Get assistance in areas such as version control, runtime error analysis, and database-related tasks.</div></li></ul></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_start_2Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-start-q2" onClick="{{q_start_2Toggle}}" aria-expanded="{{q_start_2Open}}" aria-controls="faq-start-a2" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_start_2Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>How can I access AI features in my IDE?</button></h4><div id="faq-start-a2" role="region" aria-labelledby="faq-start-q2" style="{{q_start_2Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">Find the AI Chat icon in the right sidebar of your IDE and click Install Plugin. Once installed, you can enable JetBrains AI, connect any ACP-compatible agent using your own subscription, or use AI models with your own API keys.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_start_3Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-start-q3" onClick="{{q_start_3Toggle}}" aria-expanded="{{q_start_3Open}}" aria-controls="faq-start-a3" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_start_3Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Which large language models (LLMs) are supported in JetBrains IDEs?</button></h4><div id="faq-start-a3" role="region" aria-labelledby="faq-start-q3" style="{{q_start_3Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">JetBrains IDEs can use a mix of third-party cloud models, JetBrains-trained models, and user-provided or local models.</p><p style="margin: 6px 0 0; font-weight: 600;">Third-party models via JetBrains AI</p><p style="margin: 0;">JetBrains AI provides access to a curated set of cloud models from leading providers, including OpenAI, Google, Anthropic, and xAI. These models are automatically selected for specific features or can be chosen in AI chat.</p><p style="margin: 6px 0 0; font-weight: 600;">JetBrains proprietary models or fine-tuned models</p><p style="margin: 0;">AI completion uses JetBrains-trained models like Mellum, optimized specifically for coding tasks.</p><p style="margin: 6px 0 0; font-weight: 600;">User-provided and local models</p><p style="margin: 0;">You can also connect and use models outside of JetBrains AI via API key or OAuth where supported, or connect local models via tools like Ollama or LM Studio.</p><p style="margin: 0;">For the current list of supported options, see the <a href="#supported-llms" style="text-decoration: underline;">Supported LLMs documentation</a>.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_start_4Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-start-q4" onClick="{{q_start_4Toggle}}" aria-expanded="{{q_start_4Open}}" aria-controls="faq-start-a4" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_start_4Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Can I use local models in JetBrains IDEs?</button></h4><div id="faq-start-a4" role="region" aria-labelledby="faq-start-q4" style="{{q_start_4Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">You can connect your own local LLMs (via Ollama, LM Studio, and other OpenAI-compatible servers). You can configure them in AI Assistant settings.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_start_5Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-start-q5" onClick="{{q_start_5Toggle}}" aria-expanded="{{q_start_5Open}}" aria-controls="faq-start-a5" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_start_5Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Can I connect my own AI providers to JetBrains IDEs?</button></h4><div id="faq-start-a5" role="region" aria-labelledby="faq-start-q5" style="{{q_start_5Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">Yes. JetBrains IDEs support <a href="#byok" style="text-decoration: underline;">Bring Your Own Key (BYOK)</a>, allowing you to connect your own API keys from Anthropic, OpenAI, and other OpenAI-compatible providers. You can also connect any <a href="#acp" style="text-decoration: underline;">ACP-compatible agent</a>, such as Cursor or GitHub Copilot, using your own subscription.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_start_6Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-start-q6" onClick="{{q_start_6Toggle}}" aria-expanded="{{q_start_6Open}}" aria-controls="faq-start-a6" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_start_6Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Are there any country restrictions for AI features?</button></h4><div id="faq-start-a6" role="region" aria-labelledby="faq-start-q6" style="{{q_start_6Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">Access to AI features may be restricted in certain regions due to local regulations, export controls, or the availability of AI providers. You can check the full list of supported locations <a href="#supported-locations" style="text-decoration: underline;">here</a>.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_start_7Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-start-q7" onClick="{{q_start_7Toggle}}" aria-expanded="{{q_start_7Open}}" aria-controls="faq-start-a7" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_start_7Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>How can I report a problem or provide feedback?</button></h4><div id="faq-start-a7" role="region" aria-labelledby="faq-start-q7" style="{{q_start_7Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">We encourage you to try JetBrains AI features and share your feedback to help us improve. To leave feedback about AI Assistant, you can:</p><ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px;"><li style="padding-left: 2px;">Use the <a href="#share-feedback" style="text-decoration: underline;">Share feedback</a> link in your IDE&#8217;s AI Chat tool window.</li><li style="padding-left: 2px;">Report issues or request features in <a href="#youtrack" style="text-decoration: underline;">AI Assistant&#8217;s YouTrack project</a>.</li><li style="padding-left: 2px;"><a href="#support" style="text-decoration: underline;">Contact support</a> for further assistance.</li></ul><p style="margin: 0;">We also encourage you to leave a review on <a href="#marketplace" style="text-decoration: underline;">JetBrains Marketplace</a>.</p></div></div></div></div></div></div></div></div><div style="margin-bottom: 16px;"><h3 style="margin: 0;"><button type="button" class="jb-cat" onClick="{{c_pricingToggle}}" aria-expanded="{{c_pricingOpen}}" aria-controls="faq-cat-pricing" style="display: flex; align-items: center; justify-content: space-between; width: 300px; max-width: 100%; padding: 10px 0; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 24px; font-weight: 600; line-height: 36px; color: #19191C;"><span style="position: relative;">Pricing and plans<span aria-hidden="true" style="{{c_pricingUl}}"></span></span><svg width="9" height="12" viewBox="0 0 9 12" aria-hidden="true"><path d="M0 0 L9 6 L0 12 Z" fill="#7F52FF"></path></svg></button></h3><div id="faq-cat-pricing" style="{{c_pricingPanel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 0 0 8px;"><div style="position: relative;"><span aria-hidden="true" style="{{q_pricing_0Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-pricing-q0" onClick="{{q_pricing_0Toggle}}" aria-expanded="{{q_pricing_0Open}}" aria-controls="faq-pricing-a0" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_pricing_0Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>What plans are available with a JetBrains AI subscription?</button></h4><div id="faq-pricing-a0" role="region" aria-labelledby="faq-pricing-q0" style="{{q_pricing_0Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">JetBrains AI offers AI Free*, AI Pro, AI Ultimate, and AI Enterprise. The main difference between the plans is the amount of AI Credits included for features powered by third-party AI providers.</p><p style="margin: 0;">See the <a href="#pricing" style="text-decoration: underline;">pricing page</a> for plan details and usage quotas.</p><p style="margin: 2px 0 0; font-size: 13px; line-height: 19px; color: #55555A;">* AI Free is not available in Android Studio, IntelliJ IDEA without Ultimate subscription and PyCharm without Pro subscription.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_pricing_1Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-pricing-q1" onClick="{{q_pricing_1Toggle}}" aria-expanded="{{q_pricing_1Open}}" aria-controls="faq-pricing-a1" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_pricing_1Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Is there a free trial for JetBrains AI?</button></h4><div id="faq-pricing-a1" role="region" aria-labelledby="faq-pricing-q1" style="{{q_pricing_1Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">Yes. A 30-day AI Pro trial is available when you first activate JetBrains AI. After the trial ends, you can either continue on the AI Free plan (if available in your IDE*) or upgrade to AI Pro or AI Ultimate for more usage.</p><p style="margin: 2px 0 0; font-size: 13px; line-height: 19px; color: #55555A;">* AI Free is not available in Android Studio, IntelliJ IDEA without Ultimate subscription and PyCharm without Pro subscription.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_pricing_2Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-pricing-q2" onClick="{{q_pricing_2Toggle}}" aria-expanded="{{q_pricing_2Open}}" aria-controls="faq-pricing-a2" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_pricing_2Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Who can access JetBrains AI Free and what is included?</button></h4><div id="faq-pricing-a2" role="region" aria-labelledby="faq-pricing-q2" style="{{q_pricing_2Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">AI Free is available to all users with active JetBrains IDE licenses, including educational licenses, classroom licenses, open source licenses, IDE trial licenses, licenses for users in the Startup Program, and other complimentary licenses.</p><p style="margin: 0;">However, the AI Free plan is not available in IntelliJ IDEA without an Ultimate subscription, PyCharm without a Pro subscription, and Android Studio. To use AI in those products, you must have an AI Pro subscription.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_pricing_3Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-pricing-q3" onClick="{{q_pricing_3Toggle}}" aria-expanded="{{q_pricing_3Open}}" aria-controls="faq-pricing-a3" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_pricing_3Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Who gets AI Pro for free?</button></h4><div id="faq-pricing-a3" role="region" aria-labelledby="faq-pricing-q3" style="{{q_pricing_3Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">AI Pro is included with paid All Products Pack and dotUltimate subscriptions (with some exceptions).</p><p style="margin: 0;">AI Pro is not included in complimentary All Products Pack subscriptions for students, teachers, and classrooms, or for Open Source program participants.</p><p style="margin: 2px 0 0; font-size: 13px; line-height: 19px; color: #55555A;">Note: If you get AI Pro with DataSpell, it is tied to that product only and cannot be used with other JetBrains products.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_pricing_4Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-pricing-q4" onClick="{{q_pricing_4Toggle}}" aria-expanded="{{q_pricing_4Open}}" aria-controls="faq-pricing-a4" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_pricing_4Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>What is the AI quota in JetBrains AI plans?</button></h4><div id="faq-pricing-a4" role="region" aria-labelledby="faq-pricing-q4" style="{{q_pricing_4Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">JetBrains AI subscription tiers include a fixed monthly quota of AI Credits, which regulate access to AI agents and features powered by third-party AI models.</p><p style="margin: 0;">Code completion and next edit suggestions are powered by JetBrains&#8217; tailored models, and therefore do not consume AI quota.</p><p style="margin: 0;">The AI quota matches its price, meaning 1 AI Credit is equivalent to USD 1.00 (charged in your local currency). You get AI Credits equal to the value of your plan, plus a small bonus with AI Ultimate. For example, an individual AI Ultimate subscription costs USD 30.00 per month and now comes with USD 35.00 in AI Credits (USD 5 bonus credits).</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_pricing_5Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-pricing-q5" onClick="{{q_pricing_5Toggle}}" aria-expanded="{{q_pricing_5Open}}" aria-controls="faq-pricing-a5" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_pricing_5Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>What are the quota limits for different license tiers?</button></h4><div id="faq-pricing-a5" role="region" aria-labelledby="faq-pricing-q5" style="{{q_pricing_5Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">The AI quota matches its price, meaning 1 AI Credit is equivalent to USD 1.00 (charged in your local currency). You get AI Credits equal to the value of your plan, plus a small bonus with AI Ultimate. For example, an individual AI Ultimate subscription costs USD 30.00 per month and now comes with USD 35.00 in AI Credits (USD 5 bonus credits).</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_pricing_6Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-pricing-q6" onClick="{{q_pricing_6Toggle}}" aria-expanded="{{q_pricing_6Open}}" aria-controls="faq-pricing-a6" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_pricing_6Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Can I see how much of my AI quota I&#8217;ve used?</button></h4><div id="faq-pricing-a6" role="region" aria-labelledby="faq-pricing-q6" style="{{q_pricing_6Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">Yes. You can track your remaining AI quota and any top-up AI Credits in the JetBrains AI widget in the IDE.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_pricing_7Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-pricing-q7" onClick="{{q_pricing_7Toggle}}" aria-expanded="{{q_pricing_7Open}}" aria-controls="faq-pricing-a7" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_pricing_7Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>What happens if I run out of AI quota?</button></h4><div id="faq-pricing-a7" role="region" aria-labelledby="faq-pricing-q7" style="{{q_pricing_7Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">When your monthly AI quota is exhausted, cloud-powered JetBrains AI features pause until your quota renews. You can buy additional AI Credits to continue using AI features. Your included quota resets every 30 days from the date you first activated your JetBrains AI license, which may not match your billing cycle.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_pricing_8Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-pricing-q8" onClick="{{q_pricing_8Toggle}}" aria-expanded="{{q_pricing_8Open}}" aria-controls="faq-pricing-a8" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_pricing_8Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>What are top-up AI Credits?</button></h4><div id="faq-pricing-a8" role="region" aria-labelledby="faq-pricing-q8" style="{{q_pricing_8Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">Top-up AI Credits are additional credits you can purchase to extend your cloud AI usage beyond the quota included with your JetBrains AI subscription.</p><ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px;"><li style="padding-left: 2px;">They require an active JetBrains AI license.</li><li style="padding-left: 2px;">For organizations, they are shared across the team&#8217;s JetBrains AI licenses.</li><li style="padding-left: 2px;">They are valid for 12 months.</li></ul></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_pricing_9Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-pricing-q9" onClick="{{q_pricing_9Toggle}}" aria-expanded="{{q_pricing_9Open}}" aria-controls="faq-pricing-a9" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_pricing_9Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Does my unused quota roll over to the next month?</button></h4><div id="faq-pricing-a9" role="region" aria-labelledby="faq-pricing-q9" style="{{q_pricing_9Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">No. Any unused included quota does not roll over. The AI quota resets every 30 days from the date you first activated your JetBrains AI license. However, if you purchased Top-up AI Credits, they remain valid for 12 months.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_pricing_10Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-pricing-q10" onClick="{{q_pricing_10Toggle}}" aria-expanded="{{q_pricing_10Open}}" aria-controls="faq-pricing-a10" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_pricing_10Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Is AI quota shared across IDEs and tools?</button></h4><div id="faq-pricing-a10" role="region" aria-labelledby="faq-pricing-q10" style="{{q_pricing_10Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">Yes. Once you purchase a JetBrains AI subscription, it is linked to your JetBrains Account and can be used across all supported IDEs.</p></div></div></div></div></div></div></div></div><div style="margin-bottom: 16px;"><h3 style="margin: 0;"><button type="button" class="jb-cat" onClick="{{c_privacyToggle}}" aria-expanded="{{c_privacyOpen}}" aria-controls="faq-cat-privacy" style="display: flex; align-items: center; justify-content: space-between; width: 300px; max-width: 100%; padding: 10px 0; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 24px; font-weight: 600; line-height: 36px; color: #19191C;"><span style="position: relative;">Privacy and security<span aria-hidden="true" style="{{c_privacyUl}}"></span></span><svg width="9" height="12" viewBox="0 0 9 12" aria-hidden="true"><path d="M0 0 L9 6 L0 12 Z" fill="#7F52FF"></path></svg></button></h3><div id="faq-cat-privacy" style="{{c_privacyPanel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 0 0 8px;"><div style="position: relative;"><span aria-hidden="true" style="{{q_privacy_0Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-privacy-q0" onClick="{{q_privacy_0Toggle}}" aria-expanded="{{q_privacy_0Open}}" aria-controls="faq-privacy-a0" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_privacy_0Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Does JetBrains collect my data?</button></h4><div id="faq-privacy-a0" role="region" aria-labelledby="faq-privacy-q0" style="{{q_privacy_0Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">Data sharing is opt-in for all paid licenses, including individual and company licenses (this also includes EAP and free trials). For company licenses, this setting is centrally maintained by your admins and cannot be changed individually.</p><p style="margin: 0;">For licenses that are for non-commercial use, this setting is enabled by default, but you can opt out at any time in the settings: <span style="font-weight: 600;">Appearance &amp; Behavior &#8594; System Settings &#8594; Data Sharing &#8594; Allow detailed data collection by JetBrains AI</span>.</p><p style="margin: 0;">For detailed information about our approach to data collection, please refer to our <a href="#data-policy" style="text-decoration: underline;">Data Collection and Use Policy</a>.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_privacy_1Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-privacy-q1" onClick="{{q_privacy_1Toggle}}" aria-expanded="{{q_privacy_1Open}}" aria-controls="faq-privacy-a1" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_privacy_1Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>What data can JetBrains collect?</button></h4><div id="faq-privacy-a1" role="region" aria-labelledby="faq-privacy-q1" style="{{q_privacy_1Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">JetBrains can collect two categories of data: anonymous telemetry about feature usage, and &#8211; if detailed data collection is enabled &#8211; more detailed code-related data such as prompts, responses, code snippets, edit history, terminal usage, and interactions with AI features. Detailed code-related data is used for product improvement and training JetBrains models, and it is not shared with third parties.</p><p style="margin: 0;">For detailed information about our approach to data collection, please refer to our <a href="#data-policy" style="text-decoration: underline;">Data Collection and Use Policy</a>.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_privacy_2Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-privacy-q2" onClick="{{q_privacy_2Toggle}}" aria-expanded="{{q_privacy_2Open}}" aria-controls="faq-privacy-a2" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_privacy_2Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Does JetBrains use my code to train AI models?</button></h4><div id="faq-privacy-a2" role="region" aria-labelledby="faq-privacy-q2" style="{{q_privacy_2Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">Only if you explicitly allow it. If you choose to share data with us, this data is used exclusively to improve JetBrains tools and train our own models, like Mellum, and it is never shared with third parties.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_privacy_3Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-privacy-q3" onClick="{{q_privacy_3Toggle}}" aria-expanded="{{q_privacy_3Open}}" aria-controls="faq-privacy-a3" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_privacy_3Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>Does JetBrains store user-submitted data?</button></h4><div id="faq-privacy-a3" role="region" aria-labelledby="faq-privacy-q3" style="{{q_privacy_3Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">JetBrains does not persist any customer data unless a user opts-in to Detailed Data Collection. If you do, the shared data is retained for up to one year. Any data you share will be handled responsibly, in full compliance with all EU data protection laws.</p></div></div></div></div><div style="position: relative;"><span aria-hidden="true" style="{{q_privacy_4Bar}}"></span><h4 style="margin: 0;"><button type="button" class="jb-q" id="faq-privacy-q4" onClick="{{q_privacy_4Toggle}}" aria-expanded="{{q_privacy_4Open}}" aria-controls="faq-privacy-a4" style="display: flex; align-items: center; gap: 9px; width: 100%; padding: 20px 0 20px 22px; border: 0; background: transparent; cursor: pointer; text-align: left; font-size: 19px; font-weight: 500; line-height: 24px; color: #19191C;"><span style="{{q_privacy_4Icon}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path></svg></span>What data does JetBrains send from my IDE to LLM providers?</button></h4><div id="faq-privacy-a4" role="region" aria-labelledby="faq-privacy-q4" style="{{q_privacy_4Panel}}"><div style="overflow: hidden; min-height: 0;"><div style="padding: 2px 0 16px 53px; max-width: 760px; font-size: 15px; line-height: 21px; display: flex; flex-direction: column; gap: 8px;"><p style="margin: 0;">When you use AI-powered features, the IDE sends your prompts to the LLM provider. In addition to your prompts, the IDE may add information about the context, such as pieces of code, file types, and frameworks used. This allows the LLM to provide the most relevant suggestions. JetBrains does not work with the large language model providers that use customer data for training models.</p></div></div></div></div></div></div></div></div></div></main><footer aria-label="Site footer" style="height: 146px; flex: 0 0 146px; background: #19191C;"></footer></div>
