<title>Bloom extension — live prototype</title>
<meta name="description" content="A working rebuild of the Bloom browser extension, running inside a mock browser window.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; }
#bl-root *, #bl-root *::before, #bl-root *::after { box-sizing: border-box; }
#bl-root button:focus-visible, #bl-root input:focus-visible, #bl-root select:focus-visible,
#bl-root textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#bl-root button:not(:disabled):hover { filter: brightness(0.985); }
#bl-root ::-webkit-scrollbar { width: 6px; height: 6px; }
#bl-root ::-webkit-scrollbar-thumb { background: var(--borderStrong); border-radius: 3px; }
#bl-root ::-webkit-scrollbar-track { background: transparent; }
@keyframes bloomFadeIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes popScale { from { opacity: 0; transform: scale(.92) translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #bl-root * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>

<div id="bl-root" style="width: 1200px; height: 780px; box-sizing: border-box; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #dee1e6; font-family: Figtree, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; {{rootVars}}"><div style="display: flex; align-items: flex-end; gap: 6px; height: 42px; padding: 0 14px; background: #dee1e6; flex: 0 0 auto;"><span aria-hidden="true" style="display: flex; gap: 7px; align-self: center; margin-right: 8px;"><span style="width: 11px; height: 11px; border-radius: 50%; background: #ee6a5f;"></span><span style="width: 11px; height: 11px; border-radius: 50%; background: #f5bd4f;"></span><span style="width: 11px; height: 11px; border-radius: 50%; background: #61c454;"></span></span><sc-for list="{{browsertabs}}" as="bt" hint-placeholder-count="4"><span style="display: flex; align-items: center; gap: 7px; max-width: 190px; height: 32px; padding: 0 13px; border-radius: 9px 9px 0 0; font-size: 12px; white-space: nowrap; overflow: hidden; {{bt.style}}"><span style="width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; {{bt.dot}}"></span><span style="overflow: hidden; text-overflow: ellipsis;">{{bt.title}}</span></span></sc-for></div><div style="display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 16px; background: #f1f3f4; border-bottom: 1px solid #d5d8dc; flex: 0 0 auto;"><span aria-hidden="true" style="display: flex; gap: 14px; color: #5f6368;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M15 5l-7 7 7 7"></path></svg><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M9 5l7 7-7 7"></path></svg><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5.5V11h-5.5"></path></svg></span><span style="flex: 1; display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 14px; border-radius: 15px; background: #ffffff; border: 1px solid #d5d8dc; color: #5f6368; font-size: 12.5px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><rect x="5" y="10.5" width="14" height="9.5" rx="2"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></svg><span>fieldnotes.example/attention</span></span><span aria-hidden="true" style="display: flex; align-items: center; gap: 8px;"><span style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; color: #5f6368;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M10 4h4v3.4a2 2 0 0 0 2 2h3.4v4H16a2 2 0 0 0-2 2V20h-4v-3.4a2 2 0 0 0-2-2H4.6v-4H8a2 2 0 0 0 2-2z"></path></svg></span><span id="bl-anchor" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px; background: var(--accentSoft); border: 1.5px solid var(--accent);"><svg width="17" height="17" viewBox="-11 -11 22 22" aria-hidden="true" style="flex: 0 0 auto;"><circle cx="0" cy="-6.2" r="3.9" fill="currentColor"></circle><circle cx="5.9" cy="-1.9" r="3.9" fill="currentColor"></circle><circle cx="3.6" cy="5.0" r="3.9" fill="currentColor"></circle><circle cx="-3.6" cy="5.0" r="3.9" fill="currentColor"></circle><circle cx="-5.9" cy="-1.9" r="3.9" fill="currentColor"></circle><circle cx="0" cy="0" r="2.7" fill="#ffffff" opacity="0.92"></circle></svg></span><span style="width: 26px; height: 26px; border-radius: 50%; background: #c9ced6;"></span></span></div><div id="bl-page" onMouseMove="{{pageMove}}" onMouseUp="{{pageUp}}" onMouseLeave="{{pageUp}}" style="position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; {{pageStyle}}"><div style="{{progressWrap}} position: sticky; top: 0; left: 0; right: 0; height: 0; z-index: 6;"><span style="display: block; height: 4px; background: var(--accent); transition: width .2s; {{progressBar}}"></span><span style="position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: inline-block; white-space: nowrap; padding: 5px 13px; border-radius: 999px; background: rgba(20,20,22,.78); color: #fff; font-size: 11.5px; font-weight: 600; font-family: Figtree, system-ui, sans-serif;">{{readTime}}</span></div><div style="padding-right: 424px; box-sizing: border-box;"><div style="{{proseStyle}}"><h1 onClick="{{pick0}}" onMouseEnter="{{hov0}}" style="margin: 0 0 6px; font-size: 34px; line-height: 1.18; font-weight: 700; letter-spacing: -0.02em; cursor: default;{{a0}}">Why your attention keeps leaving</h1><p onClick="{{pick1}}" onMouseEnter="{{hov1}}" style="margin: 0 0 22px; font-size: 14px; line-height: 1.5; opacity: 0.66; cursor: default;{{a1}}">Field notes on focus, context switching and the browser as a workspace</p><p onClick="{{pick2}}" onMouseEnter="{{hov2}}" style="margin: 0 0 16px; cursor: default;{{a2}}">Attention is not a switch you flip. It behaves more like a fire you have to build: kindling first, then small sticks, and only after several minutes will it hold a log without going out.</p><p onClick="{{pick3}}" onMouseEnter="{{hov3}}" style="margin: 0 0 16px; cursor: default;{{a3}}">This is why the cost of an interruption is never the interruption itself. Leaving a document to check how long is left on a timer takes two seconds. Finding your way back into the sentence you were part of the way through takes considerably longer, because the fire has to be rebuilt from kindling.</p><h2 onClick="{{pick4}}" onMouseEnter="{{hov4}}" style="margin: 26px 0 10px; font-size: 22px; line-height: 1.25; font-weight: 700; letter-spacing: -0.012em; cursor: default;{{a4}}">The browser is already the workspace</h2><p onClick="{{pick5}}" onMouseEnter="{{hov5}}" style="margin: 0 0 16px; cursor: default;{{a5}}">Most knowledge work now happens across a dozen tabs. The browser stopped being a way to visit documents and quietly became the desk those documents sit on — and yet the tools that help people concentrate still mostly live somewhere else, one alt-tab away.</p><blockquote onClick="{{pick6}}" onMouseEnter="{{hov6}}" style="margin: 22px 0; padding: 4px 0 4px 20px; border-left: 3px solid currentColor; font-size: 19px; line-height: 1.5; font-style: italic; opacity: 0.9; cursor: default;{{a6}}">The tool that keeps you in flow is the one you never have to leave the page to reach.</blockquote><p onClick="{{pick7}}" onMouseEnter="{{hov7}}" style="margin: 0 0 16px; cursor: default;{{a7}}">A timer in a separate app is a timer you will forget. A note in a separate app is a thought you will lose on the way there. Distance is the whole problem, and distance is the only thing a browser extension is genuinely good at removing.</p><p onClick="{{pick8}}" onMouseEnter="{{hov8}}" style="margin: 0 0 16px; cursor: default;{{a8}}">What follows from that is a design constraint rather than a feature list: whatever helps you focus has to fit in the small rectangle that hangs off the toolbar, and it has to feel like part of the browser rather than a visitor inside it.</p></div></div><div style="{{widgetStyle}} position: absolute; z-index: 8; align-items: center; gap: 10px; padding: 9px 13px; border-radius: 13px; background: #ffffff; border: 1px solid #e3e5ea; box-shadow: 0 14px 34px -14px rgba(0,0,0,.4); cursor: grab; user-select: none; font-family: Arial, Helvetica, sans-serif;" onMouseDown="{{widgetDown}}"><span style="display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff;"><span style="{{wg_pause}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M9.5 5v14M14.5 5v14"></path></svg></span><span style="{{wg_play}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M7 4.6l12 7.4-12 7.4z" fill="currentColor"></path></svg></span></span><span style="display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 15px; font-weight: 700; color: #1d2027; font-variant-numeric: tabular-nums; line-height: 1;">{{clock}}</span><span style="font-size: 8.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8b9098;">{{phase}}</span></span></div><div style="{{tipStyle}} position: absolute; z-index: 9; align-items: center; gap: 9px; padding: 8px 11px; border-radius: 10px; background: #15171c; color: #fff; font-family: Figtree, system-ui, sans-serif; font-size: 11px; pointer-events: none; box-shadow: 0 12px 28px -12px rgba(0,0,0,.6);"><span style="width: 17px; height: 17px; border-radius: 4px; border: 1px solid rgba(255,255,255,.3); {{tipSw}}"></span><span style="display: flex; flex-direction: column; gap: 1px;"><span style="font-weight: 700;">{{tipColor}}</span><span style="opacity: .68;">{{tipFont}}</span></span></div></div><div id="bl-popup" style="position: absolute; top: 96px; right: 16px; z-index: 20; width: 400px; height: 560px; display: flex; flex-direction: column; overflow: hidden; border-radius: 16px; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: var(--text); background: var(--bg); animation: popScale .26s ease both; {{popupStyle}}"><span aria-hidden="true" style="position: absolute; inset: 6px; border-radius: 11px; pointer-events: none; z-index: 25; {{gothFrame}}"></span><div style="display: flex; align-items: center; gap: 11px; padding: 13px 15px; background: var(--surface); border-bottom: 1px solid var(--border); flex: 0 0 auto;"><span style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 11px; background: var(--accent); flex: 0 0 auto;"><svg width="19" height="19" viewBox="-11 -11 22 22" aria-hidden="true" style="flex: 0 0 auto;"><circle cx="0" cy="-6.2" r="3.9" fill="#ffffff"></circle><circle cx="5.9" cy="-1.9" r="3.9" fill="#ffffff"></circle><circle cx="3.6" cy="5.0" r="3.9" fill="#ffffff"></circle><circle cx="-3.6" cy="5.0" r="3.9" fill="#ffffff"></circle><circle cx="-5.9" cy="-1.9" r="3.9" fill="#ffffff"></circle><circle cx="0" cy="0" r="2.7" fill="#ffffff" opacity="0.92"></circle></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0;"><span style="font-size: 16px; font-weight: 700; letter-spacing: -0.01em;">Bloom</span><span style="font-size: 11px; font-weight: 700; color: var(--accent);">{{modeLabel}}</span></span><button type="button" aria-label="Change theme" onClick="{{openTheme}}" style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); cursor: pointer;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.1 0-1 .8-1.7 1.7-1.7H16a5 5 0 0 0 5-5c0-3.9-4-7.3-9-7.3z"></path><circle cx="7.5" cy="11.5" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="11" cy="7.8" r="1.1" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="9" r="1.1" fill="currentColor" stroke="none"></circle></svg></button></div><div style="{{pn_chrome}}"><div style="display: flex; gap: 4px; padding: 4px; margin: 0 14px 10px; border-radius: 12px; background: var(--surface2);"><button type="button" id="bl-mode-classic" onClick="{{pick_m_classic}}" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; height: 32px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: background .18s, color .18s; {{st_m_classic}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9-5.3-2.9-5.3 2.9 1.1-5.9-4.3-4.1 5.9-.8z"></path></svg><span>Classic</span></button><button type="button" id="bl-mode-research" onClick="{{pick_m_research}}" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; height: 32px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: background .18s, color .18s; {{st_m_research}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M3 5.5h6a3 3 0 0 1 3 3v10a2.4 2.4 0 0 0-2.4-2.4H3zM21 5.5h-6a3 3 0 0 0-3 3v10a2.4 2.4 0 0 1 2.4-2.4H21z"></path></svg><span>Research</span></button><button type="button" id="bl-mode-creative" onClick="{{pick_m_creative}}" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; height: 32px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: background .18s, color .18s; {{st_m_creative}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M18.5 3.2l2.3 2.3-9 9-3 .7.7-3zM7 14c-2.2 0-4 1.8-4 4 0 .8-.3 1.6-1 2 1.2.7 2.4 1 3.5 1 2.5 0 4.5-2 4.5-4.5C10 15.3 8.7 14 7 14z"></path></svg><span>Creative</span></button></div></div><div style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 18px; background: var(--bg);"><div style="{{pn_focus}}"><div style="{{pn_setup}}"><div style="margin: 2px 0 8px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint);">Session length</div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px;"><sc-for list="{{presets}}" as="pr" hint-placeholder-count="4"><button type="button" onClick="{{pr.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 11px 13px; border-radius: 11px; background: var(--surface); border: 1.5px solid var(--border); cursor: pointer; text-align: left; color: var(--text); font: inherit; transition: background .18s, border-color .18s; {{pr.style}}"><span style="font-size: 14.5px; font-weight: 700;">{{pr.name}}</span><span style="font-size: 11.5px; color: var(--muted);">{{pr.sub}}</span></button></sc-for></div><div style="margin: 2px 0 8px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint);">Rounds</div><div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px;"><div style="display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 14px;"><span style="flex: 1; font-size: 13.5px; font-weight: 500;">Focus / break cycles</span><button type="button" aria-label="Fewer rounds" onClick="{{roundsDown}}" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px; background: var(--accentSoft); border: 1px solid var(--border); color: var(--accent); cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M6 12h12"></path></svg></button><span style="min-width: 30px; text-align: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">{{rounds}}<span style="font-size: 11px; color: var(--muted);">&times;</span></span><button type="button" aria-label="More rounds" onClick="{{roundsUp}}" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px; background: var(--accentSoft); border: 1px solid var(--border); color: var(--accent); cursor: pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M12 6v12M6 12h12"></path></svg></button></div></div><button type="button" onClick="{{start}}" style="display: flex; width: 100%; align-items: center; justify-content: center; gap: 9px; height: 48px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accentInk); font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 8px 22px -12px var(--glow); transition: transform .22s cubic-bezier(.33,1,.68,1);"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto;"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9-5.3-2.9-5.3 2.9 1.1-5.9-4.3-4.1 5.9-.8z"></path></svg><span>Start session &middot; {{startLabel}}</span></button></div><div style="{{pn_run}}"><div style="display: flex; flex-direction: column; align-items: center; gap: 4px;
